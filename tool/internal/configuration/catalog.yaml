  general.code.semconv.dual_emit:
    name: general.code.semconv.dual_emit
    description: |-
      When true, also emit the previous major version alongside the target version.
      For version=1, the previous version refers to the pre-stable conventions that the instrumentation emitted before the first stable semantic convention version was defined.
      For version=2 and above, the previous version is the prior stable major version (e.g., version=2, dual_emit=true emits both v2 and v1).
      Enables dual-emit for phased migration between versions.
    type: boolean
    default_behavior: false is used
  general.code.semconv.experimental:
    name: general.code.semconv.experimental
    description: Use latest experimental semantic conventions (before stable is available or to enable experimental features
      on top of stable conventions).
    type: boolean
    default_behavior: false is used
  general.code.semconv.version:
    name: general.code.semconv.version
    description: The target semantic convention version for this domain (e.g., 1).
    type: int
    default_behavior: the latest stable version is used, or if no stable version is available and .experimental is true then
      the latest experimental version is used
