  general.sanitization.url.sensitive_query_parameters/development:
    declarative_name: general.sanitization.url.sensitive_query_parameters/development
    description: >-
      List of query parameter names whose values should be redacted from URLs. Query parameter names are case-sensitive. This
      is a full override of the default keys; set an empty array to disable redaction.
    declarative_type: list
    default_behavior: The default sensitive query parameter list from the URL semantic conventions is used.
