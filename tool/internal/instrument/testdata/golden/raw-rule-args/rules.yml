raw_args:
  target: main
  where:
    func: divide
  do:
    - inject_code:
        raw: |-
          println("enter {{ .FuncName }} args={{ .FuncArgumentCount }} arg0={{ .FuncArgument 0 }} arg1={{ .FuncArgument 1 }}")
          defer println("exit {{ .FuncName }} rets={{ .FuncReturnCount }} ret0={{ .FuncReturn 0 }} ret1={{ .FuncReturn 1 }}")
