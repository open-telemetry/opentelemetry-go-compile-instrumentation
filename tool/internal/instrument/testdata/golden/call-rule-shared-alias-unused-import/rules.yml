# Both rules call the library again through one alias. The first rule adds
# the alias while the file still uses lib for B, and the second rule finds the
# alias already imported. The lib import is blanked after both rules ran.
wrap_a:
  target: main
  where:
    function_call: go.opentelemetry.io/otelc/tool/internal/instrument/testdata/golden/call-rule-shared-alias-unused-import/helpers/lib.A
  do:
    - wrap_call:
        replace: "__otelc_lib.A({{ .CallArguments }})"
  imports:
    __otelc_lib: go.opentelemetry.io/otelc/tool/internal/instrument/testdata/golden/call-rule-shared-alias-unused-import/helpers/lib

wrap_b:
  target: main
  where:
    function_call: go.opentelemetry.io/otelc/tool/internal/instrument/testdata/golden/call-rule-shared-alias-unused-import/helpers/lib.B
  do:
    - wrap_call:
        replace: "__otelc_lib.B({{ .CallArguments }})"
  imports:
    __otelc_lib: go.opentelemetry.io/otelc/tool/internal/instrument/testdata/golden/call-rule-shared-alias-unused-import/helpers/lib
