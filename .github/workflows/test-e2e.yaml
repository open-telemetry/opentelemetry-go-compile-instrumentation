name: E2E Tests
on:
  push:
    branches:
      - main
  pull_request:
# Declare default permissions as read only.
permissions:
  contents: read
jobs:
  # This is a required workflow, so it must always run and report a status.
  # We use dorny/paths-filter at the job level instead of workflow-level path filters
  # to ensure the workflow runs and the "done" job reports success even when no relevant files change.
  # This prevents PRs from being blocked by missing status checks.
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8  # v6.0.1
        with:
          persist-credentials: false
      - uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36  # v3.0.2
        id: filter
        with:
          filters: |
            code:
              - '**/*.go'
              - '**/go.mod'
              - '**/go.sum'
              - 'Makefile'
              - 'tool/**'
              - 'pkg/**'
              - 'test/**'
              - 'demo/**'
              - 'instrumentation/**/*.yaml'
              - 'instrumentation/**/*.yml'
              - '.github/workflows/test-e2e.yaml'

  test-e2e-coverage:
    name: Coverage E2E Tests
    runs-on: ubuntu-latest
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8  # v6.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@4dc6199c7b1a012772edbd06daecab0f50c9053c  # v6.1.0
        with:
          go-version-file: go.mod
      - run: make test-e2e/coverage
      - uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac  # v5.5.5
        with:
          fail_ci_if_error: true

  test-e2e:
    name: Test (go ${{ matrix.platform.os }} ${{ matrix.platform.arch }})
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    strategy:
      matrix:
        platform:
          - os: ubuntu-latest
            arch: amd64
          - os: ubuntu-22.04-arm
            arch: arm64
          - os: macos-latest
            arch: arm64
          - os: windows-latest
            arch: amd64
    runs-on: ${{ matrix.platform.os }}
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8  # v6.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@4dc6199c7b1a012772edbd06daecab0f50c9053c  # v6.1.0
        with:
          go-version-file: go.mod
          cache-dependency-path: "**/go.mod"
      - name: Install protoc
        uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b  # v3.0.0
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - run: make test-e2e
        env:
          GOARCH: ${{ matrix.platform.arch }}

  done:
    name: Done (E2E Tests)
    runs-on: ubuntu-latest
    needs: [changes, test-e2e-coverage, test-e2e]
    if: always()
    steps:
      - name: Check result
        run: |
          changes_result="${{ needs.changes.result }}"
          code_changed="${NEEDS_CHANGES_OUTPUTS_CODE}"
          coverage_result="${{ needs.test-e2e-coverage.result }}"
          e2e_result="${{ needs.test-e2e.result }}"
          echo "Changes result: $changes_result"
          echo "Code changed: $code_changed"
          echo "Coverage result: $coverage_result"
          echo "E2E result: $e2e_result"
          if [[ "$changes_result" != "success" ]]; then
            echo "❌ Change detection failed"
            exit 1
          fi
          if [[ "$code_changed" == "false" ]]; then
            echo "✅ No relevant code changes; tests skipped"
            exit 0
          fi
          if [[ "$code_changed" != "true" ]]; then
            echo "❌ Unexpected change detection output: $code_changed"
            exit 1
          fi
          if [[ "$coverage_result" == "success" && "$e2e_result" == "success" ]]; then
            echo "✅ Tests passed"
            exit 0
          fi
          echo "❌ Tests failed"
          exit 1
        env:
          NEEDS_CHANGES_OUTPUTS_CODE: ${{ needs.changes.outputs.code }}
