name: Auto-fix Bundle Conflicts

on:
  push:
    branches:
      - main
  schedule:
    # Hourly backstop; the push trigger covers the common case immediately.
    # PRs whose "mergeable" flag was still UNKNOWN right after a push are
    # picked up here on the next run.
    - cron: "23 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: Log planned actions without pushing or commenting
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  autofix:
    name: Auto-fix bundle conflicts
    runs-on: ubuntu-latest
    # Only act on the upstream repository, never on forks of it.
    if: github.repository == 'open-telemetry/opentelemetry-go-compile-instrumentation'
    # Security: `make package` is executed only on same-repository PR branches.
    # A same-repository branch can only be created by someone with push access
    # to this repository, which matches the trust level of the existing
    # regenerate-bundle workflow. Fork PR branches are never checked out or
    # built; the script only posts a help comment for them.
    #
    # The workflow's own GITHUB_TOKEN is fully de-privileged; every privileged
    # operation (git push, PR comments) uses the otelbot GitHub App token so
    # that pushes trigger the normal pull_request workflows.
    permissions: {}
    steps:
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510  # v3.3.0
        id: app-token
        with:
          client-id: ${{ vars.OTELBOT_COMPILE_INSTRUMENTATION_CLIENT_ID }}
          private-key: ${{ secrets.OTELBOT_COMPILE_INSTRUMENTATION_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
          # Pushes that carry workflow-file changes (merged from main) are
          # rejected without this permission.
          permission-workflows: write

      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8  # v6.0.1
        with:
          fetch-depth: 0
          # zizmor: ignore[artipacked]: credentials are required by the git push later in this job
          persist-credentials: true
          token: ${{ steps.app-token.outputs.token }}

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: go.mod

      - name: Auto-fix conflicted pull request branches
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: ./.github/scripts/autofix-bundle-conflicts.sh
