name: Auto-fix Bundle Conflicts

on:
  push:
    branches:
      - main
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: Probe conflicts without requesting repairs
        type: boolean
        default: false

permissions: {}

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  autofix:
    name: Select bundle repairs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      prs: ${{ steps.scan.outputs.prs }}
    if: |-
      github.repository ==
      'open-telemetry/opentelemetry-go-compile-instrumentation' &&
      github.ref == 'refs/heads/main'
    permissions:
      actions: read
      contents: read
      pull-requests: read
    steps:
      # v6.0.1
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check manual scanner permission
        if: github.event_name == 'workflow_dispatch'
        env:
          CALLER_WORKFLOW_REF: ''
          COMMENTER: ${{ github.triggering_actor }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: bash .github/scripts/check-bundle-maintainer.sh

      - name: Select bounded bundle repairs
        id: scan
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: bash .github/scripts/autofix-bundle-conflicts.sh

  repair:
    name: 'Bundle repair #${{ matrix.pr_number }}'
    needs: autofix
    if: |-
      needs.autofix.outputs.prs != '[]' &&
      needs.autofix.outputs.prs != ''
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        pr_number: ${{ fromJSON(needs.autofix.outputs.prs) }}
    permissions:
      contents: read
    uses: ./.github/workflows/regenerate-bundle.yaml
    with:
      pr_number: ${{ format('{0}', matrix.pr_number) }}
    secrets:
      OTELBOT_COMPILE_INSTRUMENTATION_PRIVATE_KEY: >-
        ${{ secrets.OTELBOT_COMPILE_INSTRUMENTATION_PRIVATE_KEY }}
