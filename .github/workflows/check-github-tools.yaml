name: Check GitHub Tools

on:
  push:
    branches:
      - main
    paths:
      - '.github/tools/**'
      - '.github/workflows/check-github-tools.yaml'
  pull_request:
    paths:
      - '.github/tools/**'
      - '.github/workflows/check-github-tools.yaml'

permissions:
  contents: read

jobs:
  test:
    name: Test GitHub Tools
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8  # v6.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Run unit tests
        run: go -C .github/tools test -v ./...

      - name: Vet code
        run: go -C .github/tools vet ./...
