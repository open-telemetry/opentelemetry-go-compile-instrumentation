name: Bundle Repair Worker

on:
  workflow_call:
    inputs:
      pr_number:
        required: true
        type: string
      base_ref:
        required: true
        type: string
      base_sha:
        required: true
        type: string
      head_ref:
        required: true
        type: string
      head_repo_full:
        required: true
        type: string
      head_sha:
        required: true
        type: string
      is_cross_repository:
        required: true
        type: string
      expires_at:
        required: false
        type: string
    secrets:
      OTELC_BUNDLE_PUSH_TOKEN:
        description: Callers forward this secret by name. The bundle-publisher environment supplies the value.
        required: false
      OTELBOT_COMPILE_INSTRUMENTATION_PRIVATE_KEY:
        required: false

permissions: {}

env:
  AUTO_DEADLINE: ${{ inputs.expires_at }}
  BASE_SHA: ${{ inputs.base_sha }}
  CALLER_WORKFLOW_REF: ${{ github.workflow_ref }}
  COMMENTER: ${{ github.event.comment.user.login || github.actor }}
  EXPECTED_HEAD_SHA: ${{ inputs.head_sha }}
  PR_NUMBER: ${{ inputs.pr_number }}
  REPO: ${{ github.repository }}
  RUN_ATTEMPT: ${{ github.run_attempt }}
  TRIGGERING_ACTOR: ${{ github.triggering_actor }}

jobs:
  generate:
    name: Generate bundle
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      artifact_id: ${{ steps.bundle.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8  # v6.0.1
        with:
          path: trusted
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          cache: false
          go-version-file: trusted/go.mod

      - name: Build bundle repair tool
        env:
          GOFLAGS: -mod=readonly
          GOPROXY: 'off'
          GOTOOLCHAIN: local
        run: go -C trusted/.tools/bundlerepair build -trimpath -o "${RUNNER_TEMP}/bundlerepair" .

      - name: Check request permission
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          "${RUNNER_TEMP}/bundlerepair" authorize

      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8  # v6.0.1
        with:
          fetch-depth: 0
          path: branch
          persist-credentials: false
          ref: ${{ inputs.head_sha }}
          repository: ${{ inputs.head_repo_full }}

      - name: Merge captured base commit
        run: |
          git -C branch fetch --no-tags "https://github.com/${REPO}.git" "${BASE_SHA}"
          "${RUNNER_TEMP}/bundlerepair" merge branch "${BASE_SHA}"

      - name: Check request before generation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          "${RUNNER_TEMP}/bundlerepair" authorize

      - name: Stage bundle sources
        run: |
          "${RUNNER_TEMP}/bundlerepair" stage branch trusted "${BASE_SHA}"

      - name: Regenerate bundle
        working-directory: trusted
        env:
          GOPROXY: https://proxy.golang.org
          GOTOOLCHAIN: local
        run: make package

      - name: Upload bundle
        id: bundle
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f  # v7.0.0
        with:
          name: otelc-bundle-pr-${{ inputs.pr_number }}-${{ github.run_attempt }}
          path: trusted/tool/data/otelc-bundle.tgz
          compression-level: 0
          if-no-files-found: error
          retention-days: 1

  push_update:
    name: Push regenerated bundle
    needs: generate
    environment: bundle-publisher
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8  # v6.0.1
        with:
          path: trusted
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          cache: false
          go-version-file: trusted/go.mod

      - name: Build bundle repair tool
        env:
          GOFLAGS: -mod=readonly
          GOPROXY: 'off'
          GOTOOLCHAIN: local
        run: go -C trusted/.tools/bundlerepair build -trimpath -o "${RUNNER_TEMP}/bundlerepair" .

      - name: Check request permission
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          "${RUNNER_TEMP}/bundlerepair" authorize

      - name: Select publisher credentials
        id: credentials
        env:
          CLIENT_ID: ${{ vars.OTELBOT_COMPILE_INSTRUMENTATION_CLIENT_ID }}
          PRIVATE_KEY: >-
            ${{ secrets.OTELBOT_COMPILE_INSTRUMENTATION_PRIVATE_KEY }}
          IS_CROSS_REPOSITORY: ${{ inputs.is_cross_repository }}
        run: |
          "${RUNNER_TEMP}/bundlerepair" credentials

      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510  # v3.3.0
        id: app-token
        if: steps.credentials.outputs.use_app == 'true'
        with:
          client-id: ${{ vars.OTELBOT_COMPILE_INSTRUMENTATION_CLIENT_ID }}
          private-key: >-
            ${{ secrets.OTELBOT_COMPILE_INSTRUMENTATION_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: read
          permission-workflows: write

      - name: Check publisher configuration
        id: identity
        env:
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          GH_TOKEN: |-
            ${{ steps.app-token.outputs.token ||
            secrets.OTELC_BUNDLE_PUSH_TOKEN }}
        run: |
          "${RUNNER_TEMP}/bundlerepair" identity

      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8  # v6.0.1
        with:
          fetch-depth: 0
          path: branch
          persist-credentials: false
          ref: ${{ inputs.head_sha }}
          repository: ${{ inputs.head_repo_full }}

      - uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3  # v8.0.0
        with:
          artifact-ids: ${{ needs.generate.outputs.artifact_id }}
          merge-multiple: true
          path: generated

      - name: Merge captured base commit
        run: |
          git -C branch fetch --no-tags "https://github.com/${REPO}.git" "${BASE_SHA}"
          "${RUNNER_TEMP}/bundlerepair" merge branch "${BASE_SHA}"

      - name: Commit and push
        env:
          BASE_REF: ${{ inputs.base_ref }}
          BOT_ID: ${{ steps.identity.outputs.id }}
          BOT_LOGIN: ${{ steps.identity.outputs.login }}
          GENERATED_BUNDLE: ${{ github.workspace }}/generated/otelc-bundle.tgz
          GH_TOKEN: |-
            ${{ steps.app-token.outputs.token ||
            secrets.OTELC_BUNDLE_PUSH_TOKEN }}
          HEAD_REF: ${{ inputs.head_ref }}
          HEAD_REPO_FULL: ${{ inputs.head_repo_full }}
        run: |
          "${RUNNER_TEMP}/bundlerepair" publish branch

      - name: Report publication failure
        if: failure()
        run: |
          {
            echo 'Publication failed. Check the error for the cause.'
            echo 'The generated artifact remains available for one day.'
          } >>"${GITHUB_STEP_SUMMARY}"
