name: Release

on:
  pull_request:
    types: [closed]
    branches:
      - main
      - 'release/v*.*.x'  # for hotfix releases

jobs:
  release:
    name: Build and Release
    runs-on: ubuntu-latest
    if: >
      github.event.pull_request.merged == true && startsWith(github.event.pull_request.head.ref, 'release/v')
    permissions:
      contents: write
    steps:
      - name: Extract version
        id: version
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          VERSION="${HEAD_REF#release/}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Determine if pre-release
        id: prerelease
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if [[ "${VERSION}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+- ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout merge commit
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8  # v6.0.1
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: 'go.mod'
          cache: false

      - name: Create and push tag
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${VERSION}" -m "Release ${VERSION}"
          git push origin "${VERSION}"

      - name: Build binaries
        run: make build-all

      - name: Generate SHA256 checksums
        run: |
          cd dist
          sha256sum otelc-* > checksums.txt

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          IS_PRERELEASE: ${{ steps.prerelease.outputs.prerelease }}
        run: |
          RELEASE_FLAGS=()
          if [ "${IS_PRERELEASE}" = "true" ]; then
            RELEASE_FLAGS+=(--prerelease)
          fi
          gh release create "${VERSION}" dist/otelc-* dist/checksums.txt \
            --title "${VERSION}" \
            --notes-file .github/release-notes.md \
            "${RELEASE_FLAGS[@]}"
