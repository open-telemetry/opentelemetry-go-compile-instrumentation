name: Unit Tests
on:
  push:
    branches:
      - main
  pull_request:
# Declare default permissions as read only.
permissions: read-all
jobs:
  # This is a required workflow, so it must always run and report a status.
  # We use dorny/paths-filter at the job level instead of workflow-level path filters
  # to ensure the workflow runs and the "done" job reports success even when no relevant files change.
  # This prevents PRs from being blocked by missing status checks.
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      code: ${{ steps.filter.outputs.code }}
      tool: ${{ steps.filter.outputs.tool }}
      pkg: ${{ steps.filter.outputs.pkg }}
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8  # v6.0.1
      - uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36  # v3.0.2
        id: filter
        with:
          filters: |
            code:
              - '**/*.go'
              - '**/go.mod'
              - '**/go.sum'
              - 'Makefile'
              - 'tool/**'
              - 'pkg/**'
              - 'test/**'
              - 'instrumentation/**/*.yaml'
              - 'instrumentation/**/*.yml'
              - '.github/workflows/test-unit.yaml'
            tool:
              - 'tool/**'
            pkg:
              - 'pkg/**'

  test-unit-coverage:
    name: Coverage Unit Tests
    runs-on: ubuntu-latest
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    steps:
      - name: Checkout Repo
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8  # v6.0.1
      - name: Install Go
        uses: actions/setup-go@4dc6199c7b1a012772edbd06daecab0f50c9053c  # v6.1.0
        with:
          go-version-file: go.mod
      - name: Run unit test coverage
        run: make test-unit/coverage
      # make test-unit/coverage leaves coverage-tool.txt, coverage-pkg.txt and
      # coverage-instrumentation.txt in the workspace. "files" only *adds* to the
      # files the action discovers on its own, so without disable_search each
      # upload below would carry all three profiles under its own flag, and the
      # flag-scoped statuses in .github/codecov.yml would measure the whole repo.
      - name: Upload tool coverage report
        if: needs.changes.outputs.tool == 'true'
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac  # v5.5.5
        with:
          files: coverage-tool.txt
          disable_search: true
          flags: tool
          fail_ci_if_error: true
      - name: Upload pkg coverage report
        if: needs.changes.outputs.pkg == 'true'
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac  # v5.5.5
        with:
          files: coverage-pkg.txt
          disable_search: true
          flags: pkg
          fail_ci_if_error: true

  test-unit:
    name: Unit Tests (go ${{ matrix.platform.os }} ${{ matrix.platform.arch }})
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    strategy:
      matrix:
        platform:
          - os: ubuntu-latest
            arch: amd64
          - os: ubuntu-22.04-arm
            arch: arm64
          - os: macos-latest
            arch: arm64
          - os: windows-latest
            arch: amd64
    runs-on: ${{ matrix.platform.os }}
    steps:
      - name: Checkout code
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8  # v6.0.1
      - name: Install Go
        uses: actions/setup-go@4dc6199c7b1a012772edbd06daecab0f50c9053c  # v6.1.0
        with:
          go-version-file: go.mod
          cache-dependency-path: "**/go.mod"
      - name: Build and test
        env:
          GOARCH: ${{ matrix.platform.arch }}
        run: make test-unit

  done:
    name: Done (Unit Tests)
    runs-on: ubuntu-latest
    needs: [changes, test-unit-coverage, test-unit]
    if: always()
    steps:
      - name: Check result
        run: |
          changes_result="${{ needs.changes.result }}"
          code_changed="${{ needs.changes.outputs.code }}"
          coverage_result="${{ needs.test-unit-coverage.result }}"
          unit_result="${{ needs.test-unit.result }}"
          echo "Changes result: $changes_result"
          echo "Code changed: $code_changed"
          echo "Coverage result: $coverage_result"
          echo "Unit result: $unit_result"
          if [[ "$changes_result" != "success" ]]; then
            echo "❌ Change detection failed"
            exit 1
          fi
          if [[ "$code_changed" == "false" ]]; then
            echo "✅ No relevant code changes; tests skipped"
            exit 0
          fi
          if [[ "$code_changed" != "true" ]]; then
            echo "❌ Unexpected change detection output: $code_changed"
            exit 1
          fi
          if [[ "$coverage_result" == "success" && "$unit_result" == "success" ]]; then
            echo "✅ Tests passed"
            exit 0
          fi
          echo "❌ Tests failed"
          exit 1
