name: Regenerate Bundle
run-name: 'Bundle repair #${{ github.event.issue.number || inputs.pr_number }}'
on:
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number
        required: true
        type: string

  workflow_call:
    inputs:
      pr_number:
        required: true
        type: string
    secrets:
      OTELC_BUNDLE_PUSH_TOKEN:
        description: Publisher environment secret. Do not pass from a caller.
        required: false
      OTELBOT_COMPILE_INSTRUMENTATION_PRIVATE_KEY:
        required: false

permissions: {}

env:
  CALLER_WORKFLOW_REF: ${{ github.workflow_ref }}
  COMMENTER: ${{ github.event.comment.user.login || github.triggering_actor }}
  REPO: ${{ github.repository }}
  RUN_ATTEMPT: ${{ github.run_attempt }}
  TRIGGERING_ACTOR: ${{ github.triggering_actor }}

concurrency:
  group: >-
    bundle-regeneration-${{ github.event.issue.number || inputs.pr_number }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare bundle regeneration
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: |-
      github.repository ==
      'open-telemetry/opentelemetry-go-compile-instrumentation' &&
      github.ref == 'refs/heads/main' &&
      ((github.event_name == 'issue_comment' &&
      github.event.issue.pull_request &&
      contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'),
      github.event.comment.author_association) &&
      github.event.comment.body == '/regenerate-bundle') ||
      inputs.pr_number != '')
    permissions:
      contents: read
    outputs:
      pr_number: ${{ steps.pr.outputs.pr_number }}
      base_ref: ${{ steps.pr.outputs.base_ref }}
      base_sha: ${{ steps.pr.outputs.base_sha }}
      head_ref: ${{ steps.pr.outputs.head_ref }}
      head_repo_full: ${{ steps.pr.outputs.head_repo_full }}
      head_sha: ${{ steps.pr.outputs.head_sha }}
      is_cross_repository: ${{ steps.pr.outputs.is_cross_repository }}
    steps:
      # v6.0.1
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8
        with:
          persist-credentials: false

      - name: Check request permission
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/check-bundle-maintainer.sh

      - name: Get pull request details
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.issue.number || inputs.pr_number }}
        run: |
          [[ "${PR_NUMBER}" =~ ^[1-9][0-9]*$ ]]
          pr_json="$(gh api "repos/${REPO}/pulls/${PR_NUMBER}")"
          jq -e '.state == "open" and .head.repo != null' \
            <<<"${pr_json}" >/dev/null
          base_ref="$(jq -r '.base.ref' <<<"${pr_json}")"
          base_sha="$(jq -r '.base.sha' <<<"${pr_json}")"
          head_ref="$(jq -r '.head.ref' <<<"${pr_json}")"
          head_repo_full="$(jq -r '.head.repo.full_name' <<<"${pr_json}")"
          head_sha="$(jq -r '.head.sha' <<<"${pr_json}")"
          git check-ref-format "refs/heads/${base_ref}"
          git check-ref-format "refs/heads/${head_ref}"
          [[ "${head_repo_full}" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]]
          [[ "${base_sha}" =~ ^[0-9a-f]{40}$ \
            && "${head_sha}" =~ ^[0-9a-f]{40}$ ]]
          {
            echo "pr_number=${PR_NUMBER}"
            echo "base_ref=${base_ref}"
            echo "base_sha=${base_sha}"
            echo "head_ref=${head_ref}"
            echo "head_repo_full=${head_repo_full}"
            echo "head_sha=${head_sha}"
            if [[ "${head_repo_full}" == "${REPO}" ]]; then
              echo 'is_cross_repository=false'
            else
              echo 'is_cross_repository=true'
            fi
          } >>"${GITHUB_OUTPUT}"

  generate:
    name: Generate bundle
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      artifact_id: ${{ steps.bundle.outputs.artifact-id }}
    steps:
      # v6.0.1
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8
        with:
          path: trusted
          persist-credentials: false

      - name: Check request permission
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash trusted/.github/scripts/check-bundle-maintainer.sh

      # v6.0.1
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8
        with:
          fetch-depth: 0
          path: branch
          persist-credentials: false
          ref: ${{ needs.prepare.outputs.head_sha }}
          repository: ${{ needs.prepare.outputs.head_repo_full }}

      # v7.0.0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          cache: false
          go-version-file: trusted/go.mod

      - name: Merge captured base commit
        working-directory: branch
        env:
          BASE_SHA: ${{ needs.prepare.outputs.base_sha }}
          REPO: ${{ github.repository }}
        run: |
          git fetch --no-tags "https://github.com/${REPO}.git" "${BASE_SHA}"
          bash ../trusted/.github/scripts/merge-bundle-branch.sh . "${BASE_SHA}"

      - name: Regenerate bundle
        working-directory: branch
        run: make package

      - name: Upload bundle
        id: bundle
        # v7.0.0
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: otelc-bundle-pr-${{ needs.prepare.outputs.pr_number }}
          path: branch/tool/data/otelc-bundle.tgz
          compression-level: 0
          if-no-files-found: error
          retention-days: 1

  push_update:
    name: Push regenerated bundle
    needs: [prepare, generate]
    environment: bundle-publisher
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      # v6.0.1
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8
        with:
          path: trusted
          persist-credentials: false

      - name: Check request permission
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash trusted/.github/scripts/check-bundle-maintainer.sh

      # v3.3.0
      - uses: >-
          actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510
        id: app-token
        if: |-
          needs.prepare.outputs.is_cross_repository == 'false' &&
          vars.OTELBOT_COMPILE_INSTRUMENTATION_CLIENT_ID != ''
        with:
          client-id: ${{ vars.OTELBOT_COMPILE_INSTRUMENTATION_CLIENT_ID }}
          private-key: >-
            ${{ secrets.OTELBOT_COMPILE_INSTRUMENTATION_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: read
          permission-workflows: write

      - name: Check publisher configuration
        id: identity
        env:
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          GH_TOKEN: |-
            ${{ steps.app-token.outputs.token ||
            secrets.OTELC_BUNDLE_PUSH_TOKEN }}
        run: |
          if [[ -z "${GH_TOKEN}" ]]; then
            echo '::error::Missing publisher token in bundle-publisher.'
            echo 'Configure OTELC_BUNDLE_PUSH_TOKEN as an environment secret.'
            echo 'The App remains supported for repository branches.'
            {
              echo 'Publishing requires a configured token.'
              echo 'The generated artifact remains available for one day.'
            } >>"${GITHUB_STEP_SUMMARY}"
            exit 1
          fi
          if [[ -n "${APP_SLUG}" ]]; then
            identity="$(gh api "users/${APP_SLUG}[bot]")"
          else
            identity="$(gh api user)"
          fi
          {
            echo "login=$(jq -r '.login' <<<"${identity}")"
            echo "id=$(jq -r '.id' <<<"${identity}")"
          } >>"${GITHUB_OUTPUT}"

      # v6.0.1
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8
        with:
          fetch-depth: 0
          path: branch
          persist-credentials: false
          ref: ${{ needs.prepare.outputs.head_sha }}
          repository: ${{ needs.prepare.outputs.head_repo_full }}

      # v8.0.0
      - uses: >-
          actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3
        with:
          artifact-ids: ${{ needs.generate.outputs.artifact_id }}
          merge-multiple: true
          path: generated

      - name: Merge captured base commit
        working-directory: branch
        env:
          BASE_SHA: ${{ needs.prepare.outputs.base_sha }}
          REPO: ${{ github.repository }}
        run: |
          git fetch --no-tags "https://github.com/${REPO}.git" "${BASE_SHA}"
          bash ../trusted/.github/scripts/merge-bundle-branch.sh . "${BASE_SHA}"

      - name: Commit and push
        working-directory: branch
        env:
          BASE_REF: ${{ needs.prepare.outputs.base_ref }}
          BASE_SHA: ${{ needs.prepare.outputs.base_sha }}
          BOT_ID: ${{ steps.identity.outputs.id }}
          BOT_LOGIN: ${{ steps.identity.outputs.login }}
          EXPECTED_HEAD_SHA: ${{ needs.prepare.outputs.head_sha }}
          GENERATED_BUNDLE: ${{ github.workspace }}/generated/otelc-bundle.tgz
          GH_TOKEN: |-
            ${{ steps.app-token.outputs.token ||
            secrets.OTELC_BUNDLE_PUSH_TOKEN }}
          HEAD_REF: ${{ needs.prepare.outputs.head_ref }}
          HEAD_REPO_FULL: ${{ needs.prepare.outputs.head_repo_full }}
          PR_NUMBER: ${{ needs.prepare.outputs.pr_number }}
          REPO: ${{ github.repository }}
        run: bash ../trusted/.github/scripts/publish-bundle.sh

      - name: Report publication failure
        if: failure()
        run: |
          {
            echo 'Publication failed. Check the error for the cause.'
            echo 'The generated artifact remains available for one day.'
          } >>"${GITHUB_STEP_SUMMARY}"
