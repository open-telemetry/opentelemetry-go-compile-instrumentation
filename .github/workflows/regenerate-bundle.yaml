name: Regenerate Bundle
run-name: 'Bundle repair #${{ github.event.issue.number || inputs.pr_number }}'
on:
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number
        required: true
        type: string

  workflow_call:
    inputs:
      pr_number:
        required: true
        type: string
      expected_head_sha:
        required: false
        type: string
      expected_base_sha:
        required: false
        type: string
      expires_at:
        required: false
        type: string
    secrets:
      OTELBOT_COMPILE_INSTRUMENTATION_PRIVATE_KEY:
        required: false

permissions: {}

env:
  AUTO_DEADLINE: ${{ inputs.expires_at }}
  BASE_SHA: ${{ inputs.expected_base_sha }}
  CALLER_WORKFLOW_REF: ${{ github.workflow_ref }}
  COMMENTER: ${{ github.event.comment.user.login || github.triggering_actor }}
  EXPECTED_HEAD_SHA: ${{ inputs.expected_head_sha }}
  PR_NUMBER: ${{ github.event.issue.number || inputs.pr_number }}
  REPO: ${{ github.repository }}
  RUN_ATTEMPT: ${{ github.run_attempt }}
  TRIGGERING_ACTOR: ${{ github.triggering_actor }}

jobs:
  prepare:
    name: Prepare bundle regeneration
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: |-
      github.repository ==
      'open-telemetry/opentelemetry-go-compile-instrumentation' &&
      github.ref == 'refs/heads/main' &&
      ((github.event_name == 'issue_comment' &&
      github.event.issue.pull_request &&
      contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'),
      github.event.comment.author_association) &&
      github.event.comment.body == '/regenerate-bundle') ||
      inputs.pr_number != '')
    permissions:
      contents: read
    outputs:
      authorized: ${{ steps.pr.outputs.authorized }}
      pr_number: ${{ steps.pr.outputs.pr_number }}
      base_ref: ${{ steps.pr.outputs.base_ref }}
      base_sha: ${{ steps.pr.outputs.base_sha }}
      head_ref: ${{ steps.pr.outputs.head_ref }}
      head_repo_full: ${{ steps.pr.outputs.head_repo_full }}
      head_sha: ${{ steps.pr.outputs.head_sha }}
      is_cross_repository: ${{ steps.pr.outputs.is_cross_repository }}
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8  # v6.0.1
        with:
          persist-credentials: false

      - name: Check request permission
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/check-bundle-maintainer.sh

      - name: Get pull request details
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [[ "${PR_NUMBER}" =~ ^[1-9][0-9]*$ ]]
          pr_json="$(gh api "repos/${REPO}/pulls/${PR_NUMBER}")"
          automatic=false
          automatic_caller="${REPO}/.github/workflows/"
          automatic_caller+='autofix-bundle-conflicts.yaml@refs/heads/main'
          if [[ "${CALLER_WORKFLOW_REF}" == "${automatic_caller}" ]]; then
            automatic=true
          fi
          jq -e --argjson automatic "${automatic}" \
            --arg head "${EXPECTED_HEAD_SHA}" \
            --arg repository "${REPO}" '
            .state == "open" and .head.repo != null and
            (if $automatic then .draft == false and .base.ref == "main"
              and .head.sha == $head
              and (.head.repo.full_name == $repository
                or .maintainer_can_modify == true)
             else true end)' <<<"${pr_json}" >/dev/null
          base_ref="$(jq -r '.base.ref' <<<"${pr_json}")"
          head_ref="$(jq -r '.head.ref' <<<"${pr_json}")"
          head_repo_full="$(jq -r '.head.repo.full_name' <<<"${pr_json}")"
          head_sha="$(jq -r '.head.sha' <<<"${pr_json}")"
          git check-ref-format "refs/heads/${base_ref}"
          git check-ref-format "refs/heads/${head_ref}"
          base_ref_uri="$(jq -nr --arg ref "${base_ref}" '$ref | @uri')"
          base_json="$(gh api "repos/${REPO}/git/ref/heads/${base_ref_uri}")"
          base_sha="$(jq -er \
            '.object | select(.type == "commit") | .sha' <<<"${base_json}")"
          if [[ "${automatic}" == true \
            && "${base_sha}" != "${BASE_SHA}" ]]; then
            printf 'The captured base branch head is no longer current.\n' >&2
            exit 1
          fi
          [[ "${head_repo_full}" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]]
          [[ "${base_sha}" =~ ^[0-9a-f]{40}$ \
            && "${head_sha}" =~ ^[0-9a-f]{40}$ ]]
          {
            echo 'authorized=true'
            echo "pr_number=${PR_NUMBER}"
            echo "base_ref=${base_ref}"
            echo "base_sha=${base_sha}"
            echo "head_ref=${head_ref}"
            echo "head_repo_full=${head_repo_full}"
            echo "head_sha=${head_sha}"
            if [[ "${head_repo_full}" == "${REPO}" ]]; then
              echo 'is_cross_repository=false'
            else
              echo 'is_cross_repository=true'
            fi
          } >>"${GITHUB_OUTPUT}"

  repair:
    needs: prepare
    if: needs.prepare.outputs.authorized == 'true'
    concurrency:
      group: bundle-regeneration-${{ needs.prepare.outputs.pr_number }}
      cancel-in-progress: false
    permissions:
      contents: read
    uses: ./.github/workflows/regenerate-bundle-worker.yaml
    with:
      pr_number: ${{ needs.prepare.outputs.pr_number }}
      base_ref: ${{ needs.prepare.outputs.base_ref }}
      base_sha: ${{ needs.prepare.outputs.base_sha }}
      head_ref: ${{ needs.prepare.outputs.head_ref }}
      head_repo_full: ${{ needs.prepare.outputs.head_repo_full }}
      head_sha: ${{ needs.prepare.outputs.head_sha }}
      is_cross_repository: ${{ needs.prepare.outputs.is_cross_repository }}
      expires_at: ${{ inputs.expires_at }}
    secrets:
      OTELC_BUNDLE_PUSH_TOKEN: ''
      OTELBOT_COMPILE_INSTRUMENTATION_PRIVATE_KEY: >-
        ${{ secrets.OTELBOT_COMPILE_INSTRUMENTATION_PRIVATE_KEY }}
