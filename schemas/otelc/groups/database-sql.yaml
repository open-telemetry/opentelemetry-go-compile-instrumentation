groups:
  # ---------------------------------------------------------------------------
  # database/sql instrumentation emission contract.
  #
  # Source of truth for this file:
  #   instrumentation/database/sql/client.go        (span lifecycle)
  #   instrumentation/database/sql/semconv/db.go     (DbClientRequestTraceAttrs)
  #
  # The database/sql instrumentation is trace-only: it creates one client span
  # per database operation and records no metrics. Every attribute is standard
  # upstream OpenTelemetry database telemetry, referenced with `ref:`.
  # `server.port` is emitted only when the endpoint carries a parseable port.
  # ---------------------------------------------------------------------------

  - id: span.otelc.db.sql.client
    type: span
    span_kind: client
    stability: development
    brief: database/sql client span, one per database operation.
    attributes:
      - ref: db.system.name
      - ref: db.operation.name
      - ref: db.namespace
      - ref: db.query.text
      - ref: network.transport
      - ref: server.address
      - ref: server.port

  - id: span.otelc.db.sql.rows
    type: span
    span_kind: internal
    stability: development
    brief: Result consumption lifetime, from query return to rows closure.
    note: >-
      The child outlives its query span and includes caller processing between reads. Returned rows counts successful Next
      calls across result sets, including when the caller closes early. An unclosed result does not emit a rows span.
    attributes:
      - ref: db.system.name
      - ref: db.operation.name
      - ref: db.namespace
      - ref: db.query.text
      - ref: network.transport
      - ref: server.address
      - ref: server.port
      - ref: db.response.returned_rows
