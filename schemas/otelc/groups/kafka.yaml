groups:
  # ---------------------------------------------------------------------------
  # segmentio/kafka-go instrumentation emission contract.
  #
  # Source of truth for this file:
  #   instrumentation/github.com/segmentio/kafka-go/producer/producer_hook.go
  #   instrumentation/github.com/segmentio/kafka-go/consumer/consumer_hook.go
  #   instrumentation/github.com/segmentio/kafka-go/semconv/client.go
  #
  # The kafka-go instrumentation is trace-only: it creates one producer span
  # per sent message and one consumer span per read message, and records no
  # metrics. `messaging.system` is always `kafka`. Consumer-only attributes
  # (`messaging.consumer.group.name`, `messaging.destination.partition.id`,
  # `messaging.kafka.offset`) are not set on producer spans. Almost every
  # attribute is standard upstream OpenTelemetry messaging telemetry,
  # referenced with `ref:`. One producer-only attribute is not covered
  # upstream and is declared locally with `id:` below: `messaging.kafka.async`.
  # ---------------------------------------------------------------------------

  - id: registry.otelc.messaging.kafka
    type: attribute_group
    display_name: otelc Kafka attributes
    brief: >
      Kafka attributes emitted by the kafka-go instrumentation that are not covered by the upstream OpenTelemetry messaging
      semantic conventions.
    attributes:
      - id: messaging.kafka.async
        type: boolean
        stability: development
        brief: >
          Whether the message was sent through a kafka.Writer with Async enabled. When true, the span only reflects local
          hand-off to the client library, not confirmed broker delivery, so its duration and status must not be read as broker
          round-trip latency or delivery success. Only ever emitted as `true`; omitted (not `false`) for synchronous writes,
          where the span already reflects a confirmed broker round-trip.
  - id: span.otelc.messaging.kafka.producer
    type: span
    span_kind: producer
    stability: development
    brief: Kafka producer span, one per sent message.
    attributes:
      - ref: messaging.system
      - ref: messaging.operation.name
      - ref: messaging.operation.type
      - ref: messaging.destination.name
      - ref: messaging.kafka.message.key
      - ref: messaging.message.body.size
      - ref: server.address
      - ref: server.port
      - ref: messaging.kafka.async

  - id: span.otelc.messaging.kafka.consumer
    type: span
    span_kind: consumer
    stability: development
    brief: Kafka consumer span, one per read message.
    attributes:
      - ref: messaging.system
      - ref: messaging.operation.name
      - ref: messaging.operation.type
      - ref: messaging.destination.name
      - ref: messaging.consumer.group.name
      - ref: messaging.kafka.message.key
      - ref: messaging.message.body.size
      - ref: messaging.destination.partition.id
      - ref: messaging.kafka.offset
      - ref: server.address
      - ref: server.port
