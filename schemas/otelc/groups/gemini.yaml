groups:
  # ---------------------------------------------------------------------------
  # google.golang.org/genai instrumentation emission contract.
  #
  # Source of truth for this file:
  #   instrumentation/google.golang.org/genai/transport.go        (span + attrs)
  #   instrumentation/google.golang.org/genai/semconv/genai.go    (attribute keys)
  #
  # The genai instrumentation is trace-only: it wraps the transport of the HTTP
  # client the SDK issues requests through and creates one client span per
  # non-streaming generateContent call (`gen_ai.operation.name` = `chat`). It
  # records no metrics. `countTokens`, `embedContent` and the remaining model
  # RPCs are not instrumented.
  #
  # Every attribute below is a standard upstream OpenTelemetry GenAI attribute,
  # except `gen_ai.usage.total_tokens` and `gen_ai.request.is_stream`, which are
  # shared with the openai-go instrumentation and declared in
  # `groups/openai.yaml` (`registry.otelc.gen_ai`). This instrumentation adds no
  # attributes of its own.
  #
  # Notes on values and conditional attributes:
  #   - `gen_ai.provider.name` and `gen_ai.system` are read from the backend the
  #     client was configured for, not guessed from the request host: the Gemini
  #     Developer API reports `gcp.gemini` / `gemini` and Vertex AI reports
  #     `gcp.vertex_ai` / `vertex_ai`.
  #   - `gen_ai.usage.output_tokens` folds `thoughtsTokenCount` into
  #     `candidatesTokenCount`. Thinking tokens are generated and billed as
  #     output but reported separately by the API.
  #   - `gen_ai.usage.input_tokens` maps to `promptTokenCount`, which already
  #     covers cached content, so it needs no adjustment.
  #   - `gen_ai.usage.total_tokens` uses the API's `totalTokenCount` when
  #     present and is otherwise derived (input + output).
  #   - `gen_ai.request.*` attributes come from the request's `generationConfig`
  #     and are absent when the caller sets no generation config.
  #   - `gen_ai.response.*` attributes are absent on error responses and on
  #     server-sent-event responses, which are passed through without
  #     accumulation. `gen_ai.request.is_stream` is set only on that SSE path.
  # ---------------------------------------------------------------------------

  - id: span.otelc.gen_ai.gemini.client
    type: span
    span_kind: client
    stability: development
    brief: Gemini client span, one per generateContent call.
    attributes:
      - ref: gen_ai.system
      - ref: gen_ai.provider.name
      - ref: gen_ai.operation.name
      - ref: gen_ai.request.model
      - ref: gen_ai.request.max_tokens
      - ref: gen_ai.request.temperature
      - ref: gen_ai.request.top_p
      - ref: gen_ai.request.top_k
      - ref: gen_ai.response.id
      - ref: gen_ai.response.model
      - ref: gen_ai.response.finish_reasons
      - ref: gen_ai.usage.input_tokens
      - ref: gen_ai.usage.output_tokens
      - ref: gen_ai.usage.total_tokens
      - ref: gen_ai.request.is_stream
      - ref: error.type
