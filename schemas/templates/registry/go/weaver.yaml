# Generates pkg/otelcconv from the attributes otelc declares itself with `id:`
# in schemas/otelc/. See docs/adr/0006-semconv-telemetry-contract-organization.md.
#
# attribute_group.go.j2 and helpers.j2 are vendored from go.opentelemetry.io/otel
# v1.46.0 (semconv/templates/registry/go). The only local change is the package
# name in attribute_group.go.j2 (semconv -> otelcconv). The text maps, comment
# formats and acronyms below are copied from the same weaver.yaml, because the
# helpers depend on them.
#
# Selection: after resolution a `ref:` attribute looks like an `id:` one, so the
# filter uses lineage instead. Groups from the otelc registry are kept, and of
# their attributes only those with no lineage entry, which are the ones declared
# with `id:`. Attributes referenced from upstream (or from another otelc group)
# carry a lineage source group and are dropped.
templates:
  - pattern: attribute_group.go.j2
    filter: |
      [.groups[]
        | select(.lineage.provenance.registry_id == "otelc")
        | . as $g
        | .attributes[]?
        | select((($g.lineage.attributes // {})[.name]) == null)
        | select(.deprecated == null)]
      | unique_by(.name)
      | group_by(.name | split(".")[0])
      | map({root_namespace: (.[0].name | split(".")[0]), attributes: .})
    application_mode: single
    file_name: attribute_group.go
comment_formats:
  go:
    format: markdown
    prefix: "// "
    indent_first_level_list_items: true
    shortcut_reference_link: true
    trim: true
    word_wrap:
      line_length: 80
  go_1tab:
    format: markdown
    prefix: "\t// "
    indent_first_level_list_items: true
    shortcut_reference_link: true
    trim: true
    word_wrap:
      line_length: 80
default_comment_format: go
text_maps:
  attribute_type_method:
    string: String
    string[]: StringSlice
    int: Int
    int64: Int64
    int[]: IntSlice
    double: Float64
    double[]: FloatSlice
    boolean: Bool
    boolean[]: BoolSlice
  attribute_type_value:
    string: string
    string[]: "...string"
    int: int
    int[]: "...int"
    double: float64
    double[]: "...float64"
    boolean: bool
    boolean[]: "...bool"
