# yaml-language-server: $schema=../../../../tool/data/schema.json

client_hook:
  target: net/http
  where:
    func: RoundTrip
    recv: "*Transport"
  do:
    - inject_hooks:
        before: BeforeRoundTrip
        after: AfterRoundTrip
        path: "go.opentelemetry.io/otelc/instrumentation/net/http/client"
