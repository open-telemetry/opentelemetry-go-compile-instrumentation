version: "v1.2.0"

# Only NewClient is hooked: in every v1 release mongo.Connect delegates to
# NewClient, so hooking Connect as well would inject the monitor twice and
# emit two spans per command.
mongodb_hook_newclient:
  target: go.mongodb.org/mongo-driver/mongo
  where:
    func: NewClient
  do:
    - inject_hooks:
        before: BeforeNewClient
        path: "go.opentelemetry.io/otelc/instrumentation/go.mongodb.org/mongo-driver/mongo"
