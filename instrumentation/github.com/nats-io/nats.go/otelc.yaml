version: "v1.2.0"

nats_hook_publish:
  target: github.com/nats-io/nats.go
  where:
    func: Publish
    recv: "*Conn"
  do:
    - inject_hooks:
        before: BeforePublish
        after: AfterPublish
        path: "go.opentelemetry.io/otelc/instrumentation/github.com/nats-io/nats.go"

nats_hook_publish_msg:
  target: github.com/nats-io/nats.go
  where:
    func: PublishMsg
    recv: "*Conn"
  do:
    - inject_hooks:
        before: BeforePublishMsg
        after: AfterPublishMsg
        path: "go.opentelemetry.io/otelc/instrumentation/github.com/nats-io/nats.go"

