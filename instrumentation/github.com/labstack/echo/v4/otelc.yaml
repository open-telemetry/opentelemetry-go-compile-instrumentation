version: "v1.0.0"

# Echo has no Context.Next. ServeHTTP matches the route with Router.Find,
# then runs the handler chain. After Find, Context.Path() is the template.
# The floor is v4.2.0: DefaultHTTPErrorHandler (and the hook's
# effectiveHTTPError) unwrap a nested *echo.HTTPError in he.Internal only
# since that version.
echo_router_find_hook:
  target: github.com/labstack/echo/v4
  version: v4.2.0
  where:
    func: Find
    recv: "*Router"
  do:
    - inject_hooks:
        after: AfterFind
        path: "go.opentelemetry.io/otelc/instrumentation/github.com/labstack/echo/v4"

# c.Error(err) calls HTTPErrorHandler immediately. It does not accumulate
# errors the way gin does. Record the error on the net/http server span.
echo_context_error_hook:
  target: github.com/labstack/echo/v4
  version: v4.2.0
  where:
    func: Error
    recv: "*context"
  do:
    - inject_hooks:
        before: BeforeError
        path: "go.opentelemetry.io/otelc/instrumentation/github.com/labstack/echo/v4"

# Default HTTPErrorHandler. 4xx (including 404/405) is skipped in the hook
# so those stay unset. Handler `return err` under a custom error handler is
# covered by the handler wrap in AfterFind; ServeHTTP itself is not hooked
# because writing e.HTTPErrorHandler from a request goroutine would race
# Echo's unlocked read of that field in ServeHTTP.
echo_default_http_error_handler_hook:
  target: github.com/labstack/echo/v4
  version: v4.2.0
  where:
    func: DefaultHTTPErrorHandler
    recv: "*Echo"
  do:
    - inject_hooks:
        before: BeforeDefaultHTTPErrorHandler
        path: "go.opentelemetry.io/otelc/instrumentation/github.com/labstack/echo/v4"
