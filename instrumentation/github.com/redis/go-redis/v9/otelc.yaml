version: "v1.0.0"

redis_hook_newclient:
  target: github.com/redis/go-redis/v9
  where:
    func: NewClient
  do:
    - inject_hooks:
        after: afterNewRedisClientV9
        path: "go.opentelemetry.io/otelc/instrumentation/github.com/redis/go-redis/v9"

redis_hook_newfailoverclient:
  target: github.com/redis/go-redis/v9
  where:
    func: NewFailoverClient
  do:
    - inject_hooks:
        after: afterNewFailOverRedisClientV9
        path: "go.opentelemetry.io/otelc/instrumentation/github.com/redis/go-redis/v9"

redis_hook_newsentinelclient:
  target: github.com/redis/go-redis/v9
  where:
    func: NewSentinelClient
  do:
    - inject_hooks:
        after: afterNewSentinelClientV9
        path: "go.opentelemetry.io/otelc/instrumentation/github.com/redis/go-redis/v9"

redis_client_hook:
  target: github.com/redis/go-redis/v9
  version: v9.0.0,v9.9.0
  where:
    func: Conn
    recv: "*Client"
  do:
    - inject_hooks:
        after: afterClientConnV9
        path: "go.opentelemetry.io/otelc/instrumentation/github.com/redis/go-redis/v9"

redis_hook_withtimeout:
  target: github.com/redis/go-redis/v9
  # v9.15.0 and v9.15.1 are retracted due to Windows build bugs.
  # Hook copying is restored in v9.23.1: https://github.com/redis/go-redis/pull/4095
  version: v9.16.0,v9.23.1
  where:
    func: WithTimeout
    recv: "*Client"
  do:
    - inject_hooks:
        after: afterClientWithTimeoutV9
        path: "go.opentelemetry.io/otelc/instrumentation/github.com/redis/go-redis/v9"
