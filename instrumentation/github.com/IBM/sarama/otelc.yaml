version: "v1.0.0"

# NewClient is the single construction path shared by NewSyncProducer,
# NewAsyncProducer, NewConsumer and NewConsumerGroup, so appending the OTel
# interceptors to the shared *Config here covers every producer and consumer
# built from it.
sarama_newclient:
  target: github.com/IBM/sarama
  where:
    func: NewClient
  do:
    - inject_hooks:
        before: BeforeNewClient
        path: "go.opentelemetry.io/otelc/instrumentation/github.com/IBM/sarama"

# Producer spans are started in the interceptor (first dispatch only; retries
# reuse the span already attached to the message) but must finish on the actual
# send result. returnSuccesses/returnErrors are the common terminal paths for
# every partition/broker producer, covering both sync and async producers and
# partial batch failures. They are unexported methods on the unexported
# *asyncProducer, but otelc supports hooking those directly.
sarama_return_successes:
  target: github.com/IBM/sarama
  where:
    func: returnSuccesses
    recv: "*asyncProducer"
  do:
    - inject_hooks:
        before: BeforeReturnSuccesses
        path: "go.opentelemetry.io/otelc/instrumentation/github.com/IBM/sarama"

sarama_return_errors:
  target: github.com/IBM/sarama
  where:
    func: returnErrors
    recv: "*asyncProducer"
  do:
    - inject_hooks:
        before: BeforeReturnErrors
        path: "go.opentelemetry.io/otelc/instrumentation/github.com/IBM/sarama"

# NewConsumerGroup calls NewClient internally; this outer hook runs first and
# attaches the group id to the consumer interceptor before the inner NewClient
# hook. NewConsumerGroupFromClient reuses an existing client and has no
# NewClient call, so it needs its own hook to set the group name.
sarama_new_consumer_group:
  target: github.com/IBM/sarama
  where:
    func: NewConsumerGroup
  do:
    - inject_hooks:
        before: BeforeNewConsumerGroup
        path: "go.opentelemetry.io/otelc/instrumentation/github.com/IBM/sarama"

sarama_new_consumer_group_from_client:
  target: github.com/IBM/sarama
  where:
    func: NewConsumerGroupFromClient
  do:
    - inject_hooks:
        before: BeforeNewConsumerGroupFromClient
        path: "go.opentelemetry.io/otelc/instrumentation/github.com/IBM/sarama"
