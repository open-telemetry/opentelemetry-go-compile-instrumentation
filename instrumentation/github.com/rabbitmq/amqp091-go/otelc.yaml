version: "v1.0.0"

# Publish, PublishWithContext, and PublishWithDeferredConfirmWithContext all
# call PublishWithDeferredConfirm. Hook that one path so a publish is one span.
amqp_hook_publish:
  target: github.com/rabbitmq/amqp091-go
  version: v1.10.0
  where:
    func: PublishWithDeferredConfirm
    recv: "*Channel"
  do:
    - inject_hooks:
        before: BeforePublishWithDeferredConfirm
        after: AfterPublishWithDeferredConfirm
        path: "go.opentelemetry.io/otelc/instrumentation/github.com/rabbitmq/amqp091-go"

