# yaml-language-server: $schema=../../../../tool/data/schema.json

gin_context_next_hook:
  target: github.com/gin-gonic/gin
  where:
    func: Next
    recv: "*Context"
  do:
    - inject_hooks:
        before: BeforeNext
        after: AfterNext
        path: "go.opentelemetry.io/otelc/instrumentation/github.com/gin-gonic/gin"
