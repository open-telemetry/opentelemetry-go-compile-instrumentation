version: "v1.0.0"

mcp_clientsession_calltool:
  target: github.com/modelcontextprotocol/go-sdk/mcp
  where:
    func: CallTool
    recv: "*ClientSession"
  do:
    - inject_hooks:
        before: BeforeCallTool
        after: AfterCallTool
        path: "go.opentelemetry.io/otelc/instrumentation/github.com/modelcontextprotocol/go-sdk/client"

# Every mcp request goes through internal/jsonrpc2.(*Connection).Call, which
# returns *AsyncCall. The after hook reads the JSON-RPC id from the result and
# the request span from the ctx parameter, then sets jsonrpc.request.id. The
# receiver and result types are internal to the SDK, so the hook matches them
# through interfaces and the generated trampoline rewrites the types.
mcp_jsonrpc2_connection_call:
  target: github.com/modelcontextprotocol/go-sdk/internal/jsonrpc2
  where:
    func: Call
    recv: "*Connection"
  do:
    - inject_hooks:
        after: AfterConnectionCall
        path: "go.opentelemetry.io/otelc/instrumentation/github.com/modelcontextprotocol/go-sdk/client"
